name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 版本号与 versionName 是否一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "未能从 app/build.gradle.kts 解析 versionName" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag 版本号 ($TAG_VERSION) 与 versionName ($GRADLE_VERSION) 不一致" >&2
            exit 1
          fi
          echo "版本号校验通过：$GRADLE_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 写入签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64 Secret，无法进行签名构建" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: 构建 release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: 校验产物已签名
        id: locate_apk
        run: |
          APK_DIR="app/build/outputs/release_apk"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name "*-release.apk" ! -name "*-unsigned.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到已签名的 release APK，可能签名未生效" >&2
            ls -la "$APK_DIR" || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: 按 commit 类型生成更新日志
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          declare -A TYPE_TITLES=(
            [feat]="新功能"
            [fix]="修复"
            [refactor]="重构"
            [perf]="性能优化"
            [docs]="文档"
            [style]="代码风格"
            [test]="测试"
            [build]="构建"
            [ci]="CI/CD"
            [chore]="杂项"
            [revert]="回退"
          )
          declare -A COMMIT_GROUPS

          while IFS='|' read -r hash subject; do
            [ -z "$hash" ] && continue
            type_raw=$(echo "$subject" | grep -oP '^[a-zA-Z]+(?=(\([^)]*\))?!?:)' || true)
            type_lower=$(echo "$type_raw" | tr '[:upper:]' '[:lower:]')
            if [ -n "$type_lower" ] && [ -n "${TYPE_TITLES[$type_lower]:-}" ]; then
              entry="- ${subject#*: } (${hash})"
              COMMIT_GROUPS[$type_lower]+="${entry}"$'\n'
            else
              entry="- ${subject} (${hash})"
              COMMIT_GROUPS[other]+="${entry}"$'\n'
            fi
          done < <(git log $RANGE --pretty=format:"%h|%s" --no-merges)

          {
            for type in feat fix refactor perf docs style test build ci chore revert other; do
              if [ -n "${COMMIT_GROUPS[$type]:-}" ]; then
                if [ "$type" = "other" ]; then
                  echo "### 其他改动"
                else
                  echo "### ${TYPE_TITLES[$type]}"
                fi
                echo
                printf '%s' "${COMMIT_GROUPS[$type]}"
                echo
              fi
            done
          } > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "无新增提交记录" > release_notes.md
          fi

          cat release_notes.md

      - name: 清理同 tag 的旧 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --yes || true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          body_path: release_notes.md
