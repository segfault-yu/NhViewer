name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 tag 版本号与 versionName 是否一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "未能从 app/build.gradle.kts 解析 versionName" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag 版本号 ($TAG_VERSION) 与 versionName ($GRADLE_VERSION) 不一致" >&2
            exit 1
          fi
          echo "版本号校验通过：$GRADLE_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 写入签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64 Secret，无法进行签名构建" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: 构建 release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: 校验产物已签名
        id: locate_apk
        run: |
          APK_DIR="app/build/outputs/release_apk"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name "*-release.apk" ! -name "*-unsigned.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到已签名的 release APK，可能签名未生效" >&2
            ls -la "$APK_DIR" || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          generate_release_notes: true
